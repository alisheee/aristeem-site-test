<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aristeem Gaming PC — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07040f;--s1:#0e0820;--s2:#150d2e;--s3:#1d1340;--bd:#2d2154;--fg:#f5f2ff;--mut:#a79ccb;--v:#6d28ff;--g:linear-gradient(90deg,#5b1cff,#b01cf0);--ok:#34d399;--warn:#f5b638;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 48px);height:100%;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.55 Inter,"Segoe UI",system-ui,Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:Outfit,Inter,system-ui,sans-serif;line-height:1.12;margin:0}
p{margin:0}
svg{display:block}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:#0a0618;color:#c9bfee;font-size:13px;border-bottom:1px solid var(--bd)}
.bar b{color:#fff;margin-right:8px}
.bar button{font:inherit;background:var(--s2);color:#c9bfee;border:1px solid var(--bd);border-radius:999px;padding:4px 12px;cursor:pointer}
.bar button.on{background:var(--g);border-color:transparent;color:#fff}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-block;border:1.5px solid transparent;background:var(--g);color:#fff;border-radius:10px;padding:12px 24px;font-weight:600;transition:transform .15s,box-shadow .15s}
.btn:hover{box-shadow:0 8px 30px #7c2cff66;transform:translateY(-1px)}
.btn.gh{background:transparent;border-color:#fff;color:#fff}.btn.gh:hover{box-shadow:none;background:#ffffff14}
.btn.sm{padding:7px 16px;font-size:14px;border-radius:8px}
.btn.dim{background:var(--s3);border-color:var(--bd)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #b794ff;outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
/* header */
.hd{position:absolute;left:0;right:0;z-index:5}
.nav{display:flex;align-items:center;gap:22px;padding:18px 0;flex-wrap:wrap}
.logo{font-family:Outfit,sans-serif;font-weight:500;letter-spacing:.22em;font-size:20px;color:#fff;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:7px;background:#fff;display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:6px 7px;border-left:4px solid #1a0b4a;border-top:4px solid #1a0b4a;transform:skewX(-20deg)}
.tabs{display:flex;gap:4px;background:#1a1040;border:1px solid var(--bd);padding:4px;border-radius:12px}
.tabs span{padding:6px 12px;border-radius:8px;font-size:14px;color:#a99cf0}.tabs .a{background:#2c1a6e;color:#fff;outline:1px solid #6d4bd8}
.sp{flex:1}.nav a{font-size:15px;color:#fff;text-decoration:none}.nav a:hover{color:#c9b3ff}
/* hero */
.hero{position:relative;padding:150px 0 100px;background:radial-gradient(900px 500px at 78% 30%,#4a12c455,transparent 70%),linear-gradient(180deg,#0b0524,#07040f);overflow:hidden}
.hero::before{content:"";position:absolute;inset:auto -10% 0;height:300px;background:repeating-linear-gradient(90deg,#6d28ff22 0 1px,transparent 1px 70px),repeating-linear-gradient(0deg,#6d28ff22 0 1px,transparent 1px 50px);transform:perspective(400px) rotateX(58deg);transform-origin:bottom;mask-image:linear-gradient(0deg,#000,transparent);-webkit-mask-image:linear-gradient(0deg,#000,transparent)}
.hg{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center;position:relative}
.hero h1{font-size:clamp(38px,5.4vw,68px);letter-spacing:-.01em}
.hero h1 .l{display:block;font-weight:300}.hero h1 b{display:block;font-weight:700}
.hero .sub{font-size:18px;color:#d8cff5;max-width:520px;margin:22px 0 28px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.hv{position:relative;min-height:380px;padding:30px 0 20px}
.orb{position:absolute;inset:8% 6%;background:radial-gradient(closest-side,#9b3cff77,transparent);filter:blur(20px);animation:pulse 5s ease-in-out infinite}
.duo{position:relative;display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:end;padding:0 4%}
.mon .stand{height:22px;width:26%;margin:0 auto;background:linear-gradient(#2a1c66,#150d2e);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.mon .stand::after{content:"";display:block}
.mon::after{content:"";display:block;height:6px;width:46%;margin:0 auto;background:#1d1440;border-radius:4px}
.dev{position:relative;border:6px solid #1d1440;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 30px 80px #5b1cff55,0 0 0 1px #5a3cc0}
.dev svg{width:100%;height:auto;aspect-ratio:5/3}
.dev.big{aspect-ratio:16/10}.dev.big svg{width:100%;height:100%;aspect-ratio:auto}
.chr{position:absolute;z-index:3;filter:drop-shadow(0 12px 18px #000b);animation:fl 5s ease-in-out infinite}
.chr svg{width:100%;height:auto}
.c1{left:-3%;bottom:-6%;width:21%}.c2{right:-2%;bottom:-4%;width:19%;animation-delay:-1.5s}.c3{left:5%;top:-4%;width:14%;animation-delay:-3s}.c4{right:2%;top:-6%;width:15%;animation-delay:-2s}
.a1,.a2,.a3,.a4{opacity:0;transform:translateY(18px);animation:in .7s forwards}
.a2{animation-delay:.15s}.a3{animation-delay:.35s}.a4{animation-delay:.5s}
@keyframes in{to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{opacity:.55;transform:scale(1.06)}}
@keyframes ping{70%{box-shadow:0 0 0 8px #34d39900}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes px{to{transform:translateX(-400px)}}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
@keyframes flow{to{background-position:-200% 0}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes glow{50%{opacity:.55}}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
/* animated game scene */
.px1{animation:px 16s linear infinite}.px2{animation:px 8s linear infinite}.px3{animation:px 2.4s linear infinite}
.run{animation:bob .45s ease-in-out infinite alternate}
.ptc{animation:rise 4s linear infinite}
.fan{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
.rgb{animation:hue 6s linear infinite}
/* marquee */
.mq{border-block:1px solid var(--bd);background:#0b0620;overflow:hidden;padding:16px 0}
.mq div{display:flex;gap:48px;width:max-content;animation:mq 30s linear infinite;font-family:Outfit,sans-serif;font-size:20px;color:#cdbdff;white-space:nowrap}
.mq span::before{content:"◆";color:#8b3cff;margin-right:48px;font-size:12px}
/* sections */
section.s{padding:84px 0}section.s.alt{background:linear-gradient(180deg,#0c0720,#0a061a)}
.s h2{font-size:clamp(28px,3.6vw,44px);margin-bottom:12px;font-weight:700}
.s .lead{color:var(--mut);max-width:620px;margin:0 0 36px;font-size:17px}
.s.ctr h2,.s.ctr .lead{text-align:center;margin-left:auto;margin-right:auto}
.g3{display:grid;gap:20px;grid-template-columns:repeat(3,1fr)}
.pc{background:var(--s1);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.pc .im{height:150px;overflow:hidden}.pc .im svg{width:100%;height:100%}
.pc div.t{padding:18px 20px 22px}.pc h3{font-size:20px;margin-bottom:6px}.pc p{color:var(--mut);font-size:15px}
/* problems */
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pg .pc{position:relative}.pg .im{height:170px;position:relative}
.pg .ib{position:absolute;inset:0;display:grid;place-items:center}
.pg .ib i{width:78px;height:78px;border-radius:22px;background:#07040fa8;border:1px solid #ffffff33;display:grid;place-items:center;color:#fff;backdrop-filter:blur(6px);box-shadow:0 12px 40px #000a}
.pg .ib svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bridge{margin-top:30px;border:1px solid #4a2fa8;border-radius:22px;padding:34px;background:radial-gradient(600px 240px at 0 0,#5b1cff44,transparent),var(--s1);display:grid;grid-template-columns:1fr 1.25fr;gap:34px;align-items:center}
.bridge h3{font-size:clamp(22px,2.6vw,30px);margin-bottom:10px}.bridge p{color:#d8cff5}
.mp{display:grid;gap:10px}
.mp div{display:grid;grid-template-columns:1fr 26px 1.2fr;gap:12px;align-items:center;background:#0b0620;border:1px solid var(--bd);border-radius:12px;padding:12px 16px;font-size:14px}
.mp .p{color:var(--mut)}.mp .a{color:#b794ff;font-weight:700;text-align:center}.mp .r{color:#fff;font-weight:600}.mp .r::before{content:"✓ ";color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center}
.ft{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:14px}
.ft li{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start}
.ft b{display:block;font-weight:600}.ft span{color:var(--mut);font-size:15px}
.ic{width:40px;height:40px;border-radius:10px;background:#2a1a66;display:grid;place-items:center;color:#cdb8ff}
.ic svg,.tl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.note{background:#1a1040;border:1px solid var(--bd);border-radius:10px;padding:12px 16px;font-size:14px;color:#d8cff5;max-width:640px}
.tl{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:5/3}.tl svg{width:100%;height:100%}
.tl span{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000}
.mt{height:6px;background:#241a4a;border-radius:3px;overflow:hidden;margin:6px 0}.mt i{display:block;height:100%;background:var(--g);border-radius:3px}.mt i.y{background:var(--warn)}
/* hardware */
.rg{display:grid;grid-template-columns:1fr minmax(210px,270px) 1fr;gap:26px;align-items:center}
.rg .col2{display:grid;gap:18px}
.spc{display:grid;grid-template-columns:54px 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,#1a1040,#0e0820);border:1px solid #3b2a82;border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.spc::after{content:"";position:absolute;inset:0;background:radial-gradient(200px 80px at 0 0,#8b3cff33,transparent);pointer-events:none}
.spc .ico{width:54px;height:54px;border-radius:14px;background:var(--g);display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px #7c2cff66}
.spc .ico svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.spc span{display:block;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
.spc b{font-family:Outfit,sans-serif;font-size:20px;font-weight:500;line-height:1.2;display:block;margin-top:2px}
.twc{position:relative;display:grid;place-items:center}
.twc::before{content:"";position:absolute;inset:6% -6%;background:radial-gradient(closest-side,#9b3cff66,transparent);filter:blur(24px);animation:pulse 5s ease-in-out infinite}
.tw{position:relative;width:100%;max-width:260px;height:auto;filter:drop-shadow(0 30px 40px #5b1cff66)}
/* sequence */
.sq{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:46px;margin-top:10px}
.sq::before{content:"";position:absolute;left:16.6%;right:16.6%;top:36px;height:3px;border-radius:2px;background:linear-gradient(90deg,#5b1cff,#e060ff,#5b1cff);background-size:200% 100%;animation:flow 3s linear infinite;opacity:.9}
.sqi{position:relative;text-align:center;z-index:1;padding:0 6px}
.sqi .nb{width:74px;height:74px;border-radius:50%;margin:0 auto 18px;background:var(--g);display:grid;place-items:center;box-shadow:0 0 0 8px #0b0720,0 10px 30px #7c2cff77;position:relative;color:#fff}
.sqi .nb svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sqi .nb em{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;background:#fff;color:#2a0f8a;font:700 14px Outfit,sans-serif;display:grid;place-items:center;font-style:normal}
.sqi small{display:block;color:#b794ff;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.sqi h3{font-size:21px;margin-bottom:8px}.sqi p{color:var(--mut);font-size:15px;max-width:290px;margin:0 auto}
.sqi:not(:last-child)::after{content:"";position:absolute;top:30px;right:-38px;width:14px;height:14px;border-top:3px solid #e060ff;border-right:3px solid #e060ff;transform:rotate(45deg)}
/* devices */
.dvg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px}
.dvg span{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);background:var(--s1);border-radius:12px;padding:12px 14px;font-family:Outfit,sans-serif;font-size:17px}
.dvg span svg{width:22px;height:22px;flex:none;fill:none;stroke:#b794ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dvg span em{display:block;font:400 11px Inter,sans-serif;color:var(--mut);font-style:normal}
.acc{border:1px solid #4a2fa8;background:linear-gradient(135deg,#1a1040,#0e0820);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.acc h4{margin:0 0 12px;font-family:Outfit,sans-serif;font-size:17px;font-weight:500}
.acc .row{display:flex;gap:12px;flex-wrap:wrap}
.acc .row span{display:flex;align-items:center;gap:8px;background:#0b0620;border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:14px}
.acc .row svg{width:24px;height:24px;fill:none;stroke:#e0a8ff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dc{position:relative;min-height:340px;display:grid;place-items:center}
.dc .lp{width:84%;margin-right:10%}
.lp .dev{border-radius:14px 14px 4px 4px}
.lp .bs{height:14px;width:112%;margin-left:-6%;background:linear-gradient(#2a1c66,#150d2e);border-radius:0 0 18px 18px;box-shadow:0 20px 40px #000a}
.dc .ph{position:absolute;right:0;bottom:-14px;width:26%;border:5px solid #1d1440;border-radius:24px;overflow:hidden;box-shadow:0 20px 50px #000c,0 0 0 1px #5a3cc0;background:#000;aspect-ratio:9/19}
.dc .ph svg{width:100%;height:100%}
.dc .pd{position:absolute;left:-2%;bottom:-24px;width:30%;filter:drop-shadow(0 12px 22px #7c2cffaa);animation:fl 6s ease-in-out infinite}
.dc .pd svg{width:100%;height:auto}
/* games */
.lcs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:34px}
.lc{display:flex;align-items:center;gap:14px;padding:14px 28px 14px 16px;border:1px solid #3b2a82;background:linear-gradient(135deg,#1a1040,#0e0820);border-radius:16px;font-family:Outfit,sans-serif;font-size:21px}
.lc .ic{width:44px;height:44px;border-radius:12px;background:var(--g);color:#fff}
.gl{text-align:center;color:var(--mut);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 16px}
.gg{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.gt{text-align:center}
.gt .ar{border-radius:20px;overflow:hidden;aspect-ratio:1;border:1px solid var(--bd);box-shadow:0 14px 34px #0009;transition:transform .2s,box-shadow .2s}
.gt:hover .ar{transform:translateY(-4px) scale(1.03);box-shadow:0 20px 44px #5b1cff66}
.gt .ar svg{width:100%;height:100%}
.gt b{display:block;font-weight:500;font-size:14px;margin-top:10px;line-height:1.25}
.gt.you .ar{display:grid;place-items:center;border:2px dashed #6d4bd8;background:#150d2e;font:300 54px Outfit,sans-serif;color:#b794ff;box-shadow:none}
.callout{margin:30px auto 0;max-width:760px;display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:center;background:#1a1040;border:1px solid #4a2fa8;border-radius:16px;padding:18px 22px}
.callout p{color:#e8e1ff;font-size:15px}.callout b{color:#fff}
/* included */
.inc2{display:grid;grid-template-columns:1.15fr 1fr;gap:44px;align-items:center}
.il{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.il li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:15px;color:#e8e1ff}
.il .ic{width:38px;height:38px}
.vs{display:grid;gap:14px;position:relative}
.vd{display:grid;grid-template-columns:48px 1fr;gap:16px;align-items:center;border-radius:18px;padding:18px 20px;background:linear-gradient(135deg,#251656,#150d2e);border:1px solid #4a2fa8}
.vd .ic{width:48px;height:48px;background:var(--g);color:#fff;border-radius:14px}
.vd b{display:block;font-family:Outfit,sans-serif;font-weight:500;font-size:18px}.vd span{color:var(--mut);font-size:13px}
.vd .mt{height:8px;margin:10px 0 0}
.vd.add{border:2px dashed #8b5cff;background:#150d2e;animation:glow 2.4s ease-in-out infinite}
.vd.add .ic{background:#2a1a66;color:#e0b8ff}
.vs .up{justify-self:center;color:#b794ff;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
/* pricing */
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
.plan{position:relative;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;text-align:left;color:var(--fg)}
.plan.sel{border-color:#7c4dff;box-shadow:0 0 0 1px #7c4dff,0 20px 60px #5b1cff44}
.plan em{font-style:italic;color:var(--mut)}
.plan .tag2{align-self:flex-start;border:1px solid #4a6ee0;color:#cfd8ff;border-radius:8px;padding:2px 10px;font-size:13px}
.plan .pp{font-family:Outfit,sans-serif;font-size:36px;font-weight:700}.plan .pp small{font-size:14px;font-weight:400;color:var(--mut)}
.plan .rw{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}.plan .rw span{color:var(--mut)}
.plan .tt{background:#0b0620;border-radius:10px;padding:12px 14px;text-align:right;font-size:13px;color:var(--mut)}.plan .tt b{display:block;color:#fff;font-size:18px}
.best{position:absolute;right:16px;top:-12px;background:#2563eb;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:600}
.plan .btn{margin-top:auto;text-align:center}
details{border-bottom:1px solid var(--bd);padding:16px 0;max-width:800px}summary{cursor:pointer;font-weight:600;font-size:17px}details p{color:var(--mut);margin-top:8px}
.cta{position:relative;text-align:center;padding:110px 0;overflow:hidden;background:#0a0618}
.cta .bg{position:absolute;inset:0;opacity:.35}.cta .bg svg{width:100%;height:100%}
.cta .wrap{position:relative}.cta h2{font-size:clamp(30px,4.4vw,54px);margin-bottom:12px}.cta p{color:#d8cff5;margin-bottom:26px}
footer{padding:28px;text-align:center;color:var(--mut);font-size:13px;background:#05030b}
/* app screens */
.app{min-height:calc(100vh - 48px);background:radial-gradient(800px 500px at 50% -10%,#3a0fa044,transparent),var(--bg)}
.center{display:grid;place-items:center;padding:40px 16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:22px;padding:36px;width:100%;max-width:900px}
.card{display:flex;flex-direction:column;min-height:0}.card .nav2{margin-top:auto;padding-top:22px}.card.mid{justify-content:center;align-items:center;text-align:center}.card.mid .tv{width:100%}.card h2{font-size:28px;text-align:center;margin-bottom:8px}.card .sub{color:var(--mut);text-align:center;max-width:600px;margin:0 auto 26px}
.card .stp{text-align:center;font-size:12px;color:var(--mut);margin-bottom:8px}
.prog{display:flex;gap:4px;max-width:260px;margin:0 auto 6px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--bd)}.prog i.d{background:#8b5cff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.tile{background:var(--s3);border:1.5px solid transparent;border-radius:14px;padding:22px 16px;text-align:center;color:var(--fg);font-size:13px}
.tile.on{border-color:#7c4dff;background:#251656}
.tile b{display:block;font-family:Outfit,sans-serif;font-size:18px;font-weight:500;margin:8px 0 4px}.tile span{color:var(--mut)}
